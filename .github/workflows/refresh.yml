name: Refresh forecasts

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/Copenhagen
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-forecasts
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lemontree255/frontier-timelines' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lightweight new-forecast check
        id: probe
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import urlopen
          from pathlib import Path
          needed = True
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              repo = os.environ['GITHUB_REPOSITORY']
              with urlopen(f'https://raw.githubusercontent.com/{repo}/main/data/forecasts.json', timeout=20) as response:
                  known = {report['url'] for report in json.load(response)['reports']}
              with urlopen('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffrontiertimelines.substack.com%2Ffeed', timeout=20) as response:
                  feed = json.load(response)
              if feed.get('status') != 'ok' or feed.get('feed', {}).get('url') != 'https://frontiertimelines.substack.com/feed':
                  raise ValueError('RSS relay failed or returned a different publication')
              items = feed.get('items')
              if not items:
                  raise ValueError('Empty RSS response')
              if not any(item['link'] in known for item in items):
                  raise ValueError('RSS history gap; manual review required')
              needed = any(item['link'] not in known and re.search(r'\btimeline\s+estimates?\b', item.get('title', ''), re.I) for item in items)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'needed={str(bool(needed)).lower()}\n')
          print('New forecast or requested validation.' if needed else 'No new forecast; skipping checkout, tests and publishing.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.probe.outputs.needed == 'true'
        with:
          ref: main
      - name: Refresh source tables
        if: steps.probe.outputs.needed == 'true'
        run: python3 scripts/refresh.py
      - name: Validate data and parser
        if: steps.probe.outputs.needed == 'true'
        run: |
          python3 -m unittest discover -s tests
          node --test model.test.mjs
          git diff --check
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from refresh import fetch, parse_table
          with open('data/forecasts.json') as source:
              report = json.load(source)['reports'][-1]
          assert parse_table(fetch(report['tableUrl']), report['estimates']) == report['estimates']
          print('Latest saved observations match the direct source table.')
          PY
      - name: Commit new observations
        if: steps.probe.outputs.needed == 'true'
        id: commit
        run: |
          if ! git diff --quiet -- data/forecasts.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/forecasts.json
            git commit -m 'Refresh Frontier Timelines observations'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger another workflow or a Pages build.
      - name: Publish graph
        if: steps.probe.outputs.needed == 'true' && (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
